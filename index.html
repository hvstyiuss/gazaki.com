<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#080b10;
  --surface:#0d1118;
  --surface-2:#111720;
  --card:#10151d;
  --border:rgba(255,255,255,.075);
  --text:#f4f7fb;
  --muted:#7f8a9a;
  --muted-2:#aab3c0;
  --green:#18c98a;
  --green-soft:rgba(24,201,138,.12);
  --hot:#ff3f5f;
  --purple:#7b55ff;
  --blue:#2589df;
}

html{scroll-behavior:smooth}

body{
  min-height:100vh;
  overflow-x:hidden;
  color:var(--text);
  background:
    radial-gradient(circle at 50% 18%,rgba(38,89,130,.12),transparent 32%),
    radial-gradient(circle at 10% 80%,rgba(24,201,138,.045),transparent 28%),
    var(--bg);
  font-family:"DM Sans",sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index:0;
}

.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 34px;
  border-bottom:1px solid var(--border);
  background:rgba(8,11,16,.82);
  backdrop-filter:blur(18px);
  position:relative;
  z-index:10;
}

.live,
.download-total{
  display:flex;
  align-items:center;
  gap:11px;
  color:#aeb7c5;
  font-family:"Playfair Display",serif;
  font-size:16px;
  font-weight:600;
}

.live strong,
.download-total strong{color:#eef3f8}

.live-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px rgba(24,201,138,.8);
}

.download-icon{
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#667487;
  color:#080b10;
  font-size:12px;
  font-family:Arial,sans-serif;
}

.hero{
  position:relative;
  z-index:1;
  max-width:1200px;
  margin:auto;
  padding:30px 28px 10px;
  text-align:center;
}

.hero-kicker{
  color:#8492a4;
  font-family:"Playfair Display",serif;
  font-size:25px;
  letter-spacing:.01em;
  margin:0 auto 58px;
}

.trending{
  text-align:left;
  max-width:790px;
  margin:0 auto 62px;
}

.trending-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:22px;
  font-family:"Playfair Display",serif;
  font-size:21px;
  color:#eef2f7;
}

.fire{
  color:#ff4260;
  font-size:23px;
  filter:drop-shadow(0 0 8px rgba(255,66,96,.35));
}

.trending-row{
  display:flex;
  gap:18px;
  overflow-x:auto;
  padding:2px 2px 12px;
  scrollbar-width:none;
}

.trending-row::-webkit-scrollbar{display:none}

.trend-item{
  flex:0 0 108px;
  text-align:center;
  cursor:pointer;
}

.trend-icon{
  width:108px;
  height:108px;
  border-radius:25px;
  object-fit:cover;
  display:block;
  background:#151b24;
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 14px 30px rgba(0,0,0,.28);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}

.trend-item:hover .trend-icon{
  transform:translateY(-4px);
  border-color:rgba(24,201,138,.32);
  box-shadow:0 18px 34px rgba(0,0,0,.38);
}

.trend-name{
  margin-top:8px;
  color:#9ba6b5;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.search-box{
  width:min(760px,100%);
  height:76px;
  margin:0 auto 64px;
  padding:7px;
  display:flex;
  align-items:center;
  background:#f5f6f8;
  border-radius:42px;
  box-shadow:0 22px 60px rgba(0,0,0,.35);
}

.search-input-wrap{
  flex:1;
  height:100%;
  display:flex;
  align-items:center;
  padding-left:28px;
}

.search-icon{
  width:25px;
  height:25px;
  margin-right:14px;
  color:#8b99ad;
  flex:none;
}

#searchInput{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#263142;
  font:500 18px "DM Sans",sans-serif;
}

#searchInput::placeholder{color:#8fa0b6}

.search-button{
  height:60px;
  min-width:178px;
  border:0;
  border-radius:34px;
  color:#fff;
  background:linear-gradient(100deg,#168ac4,#7b3fe5);
  font:700 18px "DM Sans",sans-serif;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  box-shadow:0 8px 25px rgba(93,72,224,.3);
  transition:transform .15s,filter .15s;
}

.search-button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.search-button:active{transform:scale(.98)}

.content{
  position:relative;
  z-index:1;
  max-width:1450px;
  margin:auto;
  padding:0 36px 70px;
}

.section-heading{
  max-width:1360px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.section-heading h2{
  color:#8b97a7;
  font:600 17px "DM Sans",sans-serif;
}

#searchCount{
  color:#697687;
  font-size:12px;
}

.games-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:28px;
  max-width:1360px;
  margin:auto;
}

.game-card{
  min-height:460px;
  padding:40px 34px 32px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.075);
  border-radius:28px;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,255,255,.035),transparent 32%),
    linear-gradient(145deg,#111720,#0c1118);
  box-shadow:0 20px 55px rgba(0,0,0,.28);
  transition:transform .2s,border-color .2s,box-shadow .2s;
  animation:cardIn .45s ease both;
}

.game-card:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 25%,transparent 75%,rgba(24,201,138,.025));
}

.game-card:hover{
  transform:translateY(-4px);
  border-color:rgba(24,201,138,.18);
  box-shadow:0 28px 65px rgba(0,0,0,.4);
}

.hot{
  position:absolute;
  right:26px;
  top:26px;
  z-index:2;
  padding:9px 15px;
  border-radius:20px;
  color:#fff;
  background:var(--hot);
  font:700 13px "Playfair Display",serif;
  box-shadow:0 8px 25px rgba(255,63,95,.2);
}

.game-icon-wrap{
  position:relative;
  z-index:1;
  width:145px;
  height:145px;
  margin:0 auto 28px;
  border-radius:32px;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:#141b24;
  box-shadow:0 20px 45px rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.08);
}

.game-icon{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.game-description{position:relative;z-index:1;max-width:560px;margin:0 auto 20px;color:#7f8a9a;font-size:13px;line-height:1.6;text-align:center;}\n\n.game-name{
  position:relative;
  z-index:1;
  text-align:center;
  color:#c5cbd4;
  font:600 clamp(21px,2vw,28px) "Playfair Display",serif;
  line-height:1.25;
  margin-bottom:14px;
}

.card-meta{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:center;
  gap:14px;
  color:#707c8c;
  font-size:12px;
  margin-bottom:28px;
}

.rating{color:#c5a448}

.platforms{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  max-width:480px;
  margin:auto;
}

.platform-btn{
  min-height:48px;
  border:1px solid var(--border);
  border-radius:12px;
  cursor:pointer;
  color:#fff;
  font:700 13px "DM Sans",sans-serif;
  transition:transform .15s,filter .15s;
}

.platform-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.platform-btn:active{transform:scale(.98)}

.ios{background:#177be4}
.android{background:#18b976;color:#06130d}

.no-results{
  display:none;
  text-align:center;
  padding:80px 20px;
  color:#687487;
}

.no-results strong{
  display:block;
  color:#aab3c0;
  font:600 28px "Playfair Display",serif;
  margin-bottom:8px;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:800px){
  .topbar{padding:0 18px;height:58px}
  .live,.download-total{font-size:13px}
  .download-total{display:none}
  .hero{padding:24px 16px 0}
  .hero-kicker{font-size:20px;margin-bottom:40px}
  .trending{margin-bottom:42px}
  .trending-row{gap:12px}
  .trend-item,.trend-icon{width:86px}
  .trend-icon{height:86px;border-radius:20px}
  .search-box{height:62px;margin-bottom:45px}
  .search-input-wrap{padding-left:18px}
  #searchInput{font-size:15px}
  .search-button{min-width:110px;height:50px;font-size:14px}
  .content{padding:0 16px 45px}
  .games-grid{grid-template-columns:1fr;gap:18px}
  .game-card{min-height:390px;padding:32px 20px 25px}
  .game-icon-wrap{width:125px;height:125px;margin-bottom:22px}
  .hot{right:18px;top:18px}
}

@media(max-width:430px){
  .search-button{min-width:52px;width:52px;font-size:0}
  .search-button svg{margin:0}
  .platforms{grid-template-columns:1fr}
}
</style>
</head>

const noResults = document.getElementById("noResults");
const trendingRow = document.getElementById("trendingRow");

function renderTrending() {
  trendingRow.innerHTML = "";

  GAMES.slice(0, 6).forEach(game => {
    const item = document.createElement("div");
    item.className = "trend-item";
    item.innerHTML = `
      <img class="trend-icon" src="${game.img}" alt="${escapeHtml(game.name)}">
      <div class="trend-name">${escapeHtml(game.name)}</div>
    `;
    item.addEventListener("click", () => {
      searchInput.value = game.name;
      filterGames(game.name);
      document.querySelector(".games-grid").scrollIntoView({behavior:"smooth", block:"start"});
    });
    trendingRow.appendChild(item);
  });
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function renderGames(list) {
  grid.innerHTML = "";

  if (!list.length) {
    noResults.style.display = "block";
    searchCount.textContent = "0 results";
    return;
  }

  noResults.style.display = "none";
  searchCount.textContent = list.length < GAMES.length ? `${list.length} results` : "";

  list.forEach((game, index) => {
    const card = document.createElement("article");
    card.className = "game-card";
    card.style.animationDelay = `${index * .05}s`;

    const title = escapeHtml(game.name);
    const image = escapeHtml(game.img);
    const bg = escapeHtml(game.bg || "#151b24");

    card.innerHTML = `
      <div class="hot">♦ HOT</div>

      <div class="game-icon-wrap" style="background:${bg}">
        <img class="game-icon" src="${image}" alt="${title}" loading="lazy">
      </div>

      <h3 class="game-name">${title}</h3>

      ${game.description ? `<p class="game-description">${escapeHtml(game.description)}</p>` : ""}

      <div class="card-meta">
        <span class="rating">★ ${escapeHtml(game.rating || "—")}</span>
        <span>•</span>
        <span>${escapeHtml(game.reviews || "—")} reviews</span>
        <span>•</span>
        <span>${escapeHtml(game.downloads || "—")}</span>
      </div>

      <div class="platforms">
        <button class="platform-btn ios" data-url="${escapeHtml(game.iosUrl || "#")}"> &nbsp; iOS</button>
        <button class="platform-btn android" data-url="${escapeHtml(game.androidUrl || "#")}">▶ &nbsp; Android</button>
      </div>
    `;

    card.querySelector(".ios").addEventListener("click", () => goToDownload(game.iosUrl));
    card.querySelector(".android").addEventListener("click", () => goToDownload(game.androidUrl));

    grid.appendChild(card);
  });
}

function filterGames(query) {
  const q = query.trim().toLowerCase();

  if (!q) {
    renderGames(GAMES);
    return;
  }

  renderGames(
    GAMES.filter(game => String(game.name || "").toLowerCase().includes(q))
  );
}

function goToDownload(url) {
  if (!url || url === "#") return;
  window.location.href = url;
}

searchInput.addEventListener("input", () => filterGames(searchInput.value));

searchButton.addEventListener("click", () => {
  filterGames(searchInput.value);
});

searchInput.addEventListener("keydown", event => {
  if (event.key === "Enter") filterGames(searchInput.value);
});

window.addEventListener("DOMContentLoaded", () => {
  renderTrending();
  renderGames(GAMES);

  const params = new URLSearchParams(window.location.search);
  const query = params.get("search") || params.get("q");

  if (query) {
    searchInput.value = query;
    filterGames(query);
  }
});
</script>

</body>
</html>
